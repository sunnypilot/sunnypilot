name: Compile warp for sunnypilot modeld

on:
  workflow_dispatch:

env:
  WARP_DIR: openpilot/sunnypilot/modeld_v2/models

jobs:
  compile_warps:
    strategy:
      matrix:
        include:
          - target: qcom
            runs-on: ubuntu-24.04-arm
            prefix: driving_warp
            flags: DEV=MOCK+QCOM IMAGE=1 FLOAT16=1 NOLOCALS=1 JIT_BATCH_SIZE=0 OPENPILOT_HACKS=1
            args: --split-frames
          - target: chestnut
            runs-on: ubuntu-24.04
            prefix: big_driving_warp
            flags: DEV=MOCKUSB+AMD:LLVM FRAME_DEV=CPU FLOAT16=1 JIT_BATCH_SIZE=0 GMMU=0 CHECK_OOB=0 TC_OPT=2 TC_MIN_GLOBALS=32
            args: ''
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up the qcom mock
        if: matrix.target == 'qcom'
        uses: ./.github/workflows/setup-qcom-mock
        with:
          hf_token: ${{ secrets.HF_TOKEN }}

      - name: Install LLVM 20 and ROCm comgr for the amd mock
        if: matrix.target == 'chestnut'
        uses: ./.github/workflows/setup-amd-mock
        with:
          emu_cache: warp

      - name: Install the amd mock build dependencies
        if: matrix.target == 'chestnut'
        run: python3 -m pip install -q numpy zstandard

      - name: Compile Warp Kernels
        run: |
          export PYTHONPATH="${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}"
          mkdir -p "$WARP_DIR"
          MODEL_SIZE=$(python3 -c "from openpilot.common.transformations.model import MEDMODEL_INPUT_SIZE as s; print(f'{s[0]}x{s[1]}')")
          CAMERA_RES=$(python3 -c "from openpilot.common.transformations.camera import _ar_ox_fisheye as a, _os_fisheye as o; print(f'{a.width}x{a.height} {o.width}x{o.height}')")
          for res in $CAMERA_RES; do
            FRAME_PARAM=$(python3 -c "from openpilot.system.camerad.cameras.nv12_info import get_nv12_info; w, h = map(int, '${res}'.split('x')); stride, y_h, uv_h, _ = get_nv12_info(w, h); print(f'{w},{h},{stride},{y_h},{uv_h},{stride * (y_h + uv_h)}')")
            WARP_PKL="$WARP_DIR/${{ matrix.prefix }}_${res}_tinygrad.pkl"
            echo "Compiling $WARP_PKL"
            env ${{ matrix.flags }} python3 openpilot/sunnypilot/modeld_v2/compile_warp.py \
              --frame ${FRAME_PARAM} --warp-to ${MODEL_SIZE} ${{ matrix.args }} --output "${WARP_PKL}"
          done

      - name: Replay their check frames on the mock and require the result bit for bit
        env:
          DEV: ${{ matrix.target == 'chestnut' && 'MOCKUSB+AMD' || 'MOCK+QCOM' }}
          PYTHONPATH: ${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}
        run: python3 -m openpilot.sunnypilot.modeld_v2.mock_parity check "$WARP_DIR"/${{ matrix.prefix }}_*_tinygrad.pkl

      - uses: actions/upload-artifact@v4
        with:
          name: warps-${{ matrix.target }}
          path: ${{ env.WARP_DIR }}/${{ matrix.prefix }}_*_tinygrad.pkl
          if-no-files-found: error

  create_pr:
    needs: compile_warps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: warps-*
          path: ${{ env.WARP_DIR }}
          merge-multiple: true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@9153d834b60caba6d51c9b9510b087acf9f33f83
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: credential.https://huggingface.co.helper
          GIT_CONFIG_VALUE_0: '!f() { test "$1" = get && echo username=user && echo "password=$HF_TOKEN"; }; f'
        with:
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "[bot] Update warp pkl for modeld_v2"
          title: "[bot] Update modeld_v2 Warp"
          branch: "auto/compile-warp-kernels"
          base: "master"
          delete-branch: true
          labels: bot
          add-paths: |
            openpilot/sunnypilot/modeld_v2/models/*.pkl

      - name: Reset lfs access
        if: always()
        run: git config --local --unset-all "lfs.$(git config -f .lfsconfig lfs.url).access" || true
