name: Build chestnut model caches

on:
  push:
    branches: [master]
    paths:
      - 'tinygrad_repo'
      - 'openpilot/sunnypilot/modeld_v2/helpers.py'
      - 'openpilot/sunnypilot/models/fetcher.py'
  workflow_call:
    inputs:
      hf_repo:
        required: false
        type: string
        default: 'sunnypilot/sunnypilot_models_v1'
      docs_repo:
        required: false
        type: string
        default: 'sunnypilot/sunnypilot-models'
  workflow_dispatch:
    inputs:
      hf_repo:
        description: 'Hugging Face dataset the chestnut models are in'
        required: false
        type: string
        default: 'sunnypilot/sunnypilot_models_v1'
      docs_repo:
        description: 'Registry repo whose gh-pages gets the cache manifest'
        required: false
        type: string
        default: 'sunnypilot/sunnypilot-models'

concurrency:
  group: chestnut-caches
  cancel-in-progress: false

jobs:
  build_caches:
    runs-on: [self-hosted, chestnut]
    env:
      HF_REPO: ${{ inputs.hf_repo || 'sunnypilot/sunnypilot_models_v1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Checkout docs repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.docs_repo || 'sunnypilot/sunnypilot-models' }}
          ref: gh-pages
          path: docs
          ssh-key: ${{ secrets.CI_SUNNYPILOT_DOCS_PRIVATE_KEY }}

      - name: Build caches
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          source /etc/profile
          export UV_PROJECT_ENVIRONMENT=${HOME}/venv UV_PYTHON_PREFERENCE=managed UV_PYTHON_INSTALL_DIR=${HOME}/uv/python VIRTUAL_ENV=${HOME}/venv
          uv sync --frozen && source ${HOME}/venv/bin/activate
          export PYTHONPATH="${{ github.workspace }}/tinygrad_repo:${{ github.workspace }}"
          rm -rf caches
          python3 release/ci/build_chestnut_caches.py --work-dir /data/tmp/chestnut_caches --upload-dir caches --docs-dir docs
          if [ -d caches ]; then uv tool run --from huggingface_hub hf upload "$HF_REPO" caches . --repo-type=dataset; fi

      - name: Push cache manifest
        run: |
          cd docs
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          mkdir -p ../manifests && git status --porcelain docs/caches | awk '{print $2}' | xargs -r -I{} cp {} ../manifests/  # only what this run changed
          ls ../manifests/*.json > /dev/null 2>&1 || { echo "No manifest changes"; exit 0; }
          for attempt in $(seq 1 10); do
            git fetch origin gh-pages && git reset --hard origin/gh-pages
            mkdir -p docs/caches && cp ../manifests/*.json docs/caches/
            git add docs/caches
            git commit -m "Update chestnut cache manifest" || { echo "No changes to commit"; exit 0; }
            git push origin gh-pages && exit 0
            sleep $((attempt * 5))
          done
          exit 1
