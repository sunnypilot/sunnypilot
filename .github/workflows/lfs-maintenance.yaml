name: Sync comma's LFS

env:
  LFS_URL: 'https://huggingface.co/sunnypilot/sunnypilot-lfs.git/info/lfs'
  LFS_PUSH_URL: 'https://huggingface.co/sunnypilot/sunnypilot-lfs.git/info/lfs'

on:
  schedule:
    - cron: '0 0 * * *'  # Runs at 00:00 UTC every day
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'
  workflow_dispatch: # enables manual triggering
    inputs:
      upstream_branch:
        default: 'master'
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    # Skip if PR is in draft mode
    if: (github.event_name != 'pull_request' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) && !github.event.pull_request.head.repo.fork
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: 'commaai/openpilot'
          ref: ${{ inputs.upstream_branch }}

      - name: LFS Fetch
        run: |
          git lfs fetch

      - name: Set up Git
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'

      - name: Setup hf
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global credential.helper store
          echo "https://user:${HF_TOKEN}@huggingface.co" > ~/.git-credentials

      - name: Ensure branch
        run: |
          if git symbolic-ref -q HEAD >/dev/null; then
              echo "Already on a branch, proceeding with push"
            else
              echo "Detached HEAD state detected, creating temporary branch"
            git checkout -b temp_branch
          fi

      - name: Update LFS Config
        run: |
          echo '[lfs]' > .lfsconfig
          echo '    url = ${{ env.LFS_URL }}' >> .lfsconfig
          echo '    pushurl = ${{ env.LFS_PUSH_URL }}' >> .lfsconfig
          echo '    locksverify = false' >> .lfsconfig

      - name: Configure LFS transfer settings
        run: |
          git config lfs.activitytimeout 300
          git config lfs.transfer.maxretries 5
          git config lfs.concurrenttransfers 4

      - name: Push LFS
        id: sync-and-commit
        run: |
          git lfs ls-files -l
          for attempt in 1 2 3; do
            echo "Push attempt $attempt..."
            git lfs push --all origin && exit 0
            echo "Attempt $attempt failed, retrying in 30s..."
            sleep 30
          done
          echo "All push attempts failed"
          exit 1

      - name: Checkout sunnypilot
        uses: actions/checkout@v4
        with:
          repository: 'sunnypilot/sunnypilot'
          path: sunnypilot
          fetch-depth: 0
          filter: blob:limit=1k
          lfs: false

      - name: Reference objects on sunnypilot-lfs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          GIT_LFS_SKIP_SMUDGE=1 git clone --quiet https://huggingface.co/sunnypilot/sunnypilot-lfs hf-lfs
          mkdir -p hf-lfs/all
          cat > scan_pointers.py <<'EOF'
          import re, subprocess, sys, threading
          repo = sys.argv[1]
          chk = subprocess.run(["git", "-C", repo, "cat-file", "--batch-all-objects",
                                "--batch-check=%(objectname) %(objecttype) %(objectsize)"],
                               capture_output=True, text=True, check=True).stdout
          small = [f[0] for f in (l.split() for l in chk.splitlines()) if f[1] == "blob" and int(f[2]) < 1024]
          p = subprocess.Popen(["git", "-C", repo, "cat-file", "--batch=%(objectsize)"],
                               stdin=subprocess.PIPE, stdout=subprocess.PIPE)
          def feed():
              for sha in small:
                  p.stdin.write(sha.encode() + b"\n")
              p.stdin.close()
          threading.Thread(target=feed, daemon=True).start()
          rx = re.compile(rb"^version https://git-lfs\.github\.com/spec/v1\noid sha256:([0-9a-f]{64})\nsize ([0-9]+)\n")
          seen = {}
          for _ in small:
              n = int(p.stdout.readline()); body = p.stdout.read(n); p.stdout.read(1)
              m = rx.match(body)
              if m:
                  seen.setdefault(m.group(1).decode(), m.group(2).decode())
          for oid, size in sorted(seen.items()):
              print(oid, size)
          EOF
          for repo in . sunnypilot; do
            python3 scan_pointers.py "$repo"
          done | sort -u | while read -r oid size; do
            [ -e "hf-lfs/all/$oid" ] && continue
            printf 'version https://git-lfs.github.com/spec/v1\noid sha256:%s\nsize %s\n' "$oid" "$size" > "hf-lfs/all/$oid"
            echo "$oid"
          done > new_oids.txt
          echo "new pointer files: $(wc -l < new_oids.txt)"

          dropped=0
          while mapfile -t -n 100 chunk && ((${#chunk[@]})); do
            body=$(for oid in "${chunk[@]}"; do
                     size=$(awk '/^size /{print $2}' "hf-lfs/all/$oid")
                     printf '{"oid":"%s","size":%s}\n' "$oid" "$size"
                   done | jq -s '{operation:"download",transfers:["basic"],objects:.}')
            for attempt in 1 2 3 4 5; do
              resp=$(curl -sS -u "user:${HF_TOKEN}" -w '\n%{http_code}' \
                       -H 'Accept: application/vnd.git-lfs+json' -H 'Content-Type: application/vnd.git-lfs+json' \
                       --data "$body" "${LFS_URL}/objects/batch") && [ "$(tail -n1 <<<"$resp")" = 200 ] && break
              echo "batch check attempt $attempt failed ($(tail -n1 <<<"$resp")), retrying in 60s"; sleep 60
            done
            [ "$(tail -n1 <<<"$resp")" = 200 ] || { echo "batch check failed"; exit 1; }
            for oid in $(sed '$d' <<<"$resp" | jq -r '.objects[] | select(.error) | .oid'); do
              rm -f "hf-lfs/all/$oid"; dropped=$((dropped+1))
            done
          done < new_oids.txt
          echo "dropped (not on HF): $dropped"

          cd hf-lfs
          git add -A all
          if git diff --cached --quiet; then
            echo "nothing new to reference"
            exit 0
          fi
          git commit -q -m "Reference $(git diff --cached --name-only | wc -l | tr -d ' ') new LFS objects"
          git push origin HEAD:main
