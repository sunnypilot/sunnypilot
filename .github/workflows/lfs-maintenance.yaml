name: Sync comma's LFS

# Mirrors the LFS objects of upstream's tip from comma's HF bucket into sunnypilot's,
# so lfs.py clients (devices, CI) find every object in one bucket.
env:
  UPSTREAM_BUCKET: 'commaai/openpilot-lfs'
  SUNNYPILOT_BUCKET: 'sunnypilot/sunnypilot-lfs'

on:
  schedule:
    - cron: '0 0 * * *'  # Runs at 00:00 UTC every day
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'
  workflow_dispatch: # enables manual triggering
    inputs:
      upstream_branch:
        default: 'master'
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    # Skip if PR is in draft mode
    if: (github.event_name != 'pull_request' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) && !github.event.pull_request.head.repo.fork
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: 'commaai/openpilot'
          ref: ${{ inputs.upstream_branch }}
          lfs: false

      - name: Install hf-xet
        run: |
          python3 -m venv "$RUNNER_TEMP/lfs-venv"
          "$RUNNER_TEMP/lfs-venv/bin/pip" install -q hf-xet==1.7.0
          echo "$RUNNER_TEMP/lfs-venv/bin" >> "$GITHUB_PATH"

      - name: Fetch from comma's bucket
        run: OPENPILOT_LFS_BUCKET="$UPSTREAM_BUCKET" ./lfs.py pull --exclude=''

      - name: Upload to sunnypilot's bucket
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          OPENPILOT_LFS_BUCKET="$SUNNYPILOT_BUCKET" python3 -c "
          import lfs
          objects = list(lfs.pointers_for_index())
          lfs.upload(objects)
          print(f'{len(objects)} objects present in {lfs.BUCKET}')
          "

  mirror-git-lfs:
    # Clients still on git-lfs (devices on an older updater) fetch from the .lfsconfig model repo, which lfs.py never uploads to
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Fetch what the model repo lacks from sunnypilot's bucket
        run: |
          python3 -c "
          import lfs
          objects = dict(lfs.pointers_for_index().keys())
          missing = sorted(objects.keys() - lfs.endpoint_objects(objects).keys())
          lfs.parallel(lfs.download_one, [(oid, objects[oid]) for oid in missing])
          for oid in missing:
            print(oid)
          " > missing.txt
          echo "$(wc -l < missing.txt) objects missing from the model repo"

      - name: Upload to the model repo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global credential.https://huggingface.co.helper '!f() { echo username=hf; echo "password=$HF_TOKEN"; }; f'
          xargs -r git lfs push --object-id origin < missing.txt
