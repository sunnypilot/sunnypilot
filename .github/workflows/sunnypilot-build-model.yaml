name: Build Model from Upstream

env:
  BUILD_DIR: "/data/openpilot"
  OUTPUT_DIR: ${{ github.workspace }}/output
  SCONS_CACHE_DIR: ${{ github.workspace }}/release/ci/scons_cache
  UPSTREAM_REPO: "commaai/openpilot"
  TINYGRAD_PATH: ${{ github.workspace }}/tinygrad_repo
  MODELS_DIR: ${{ github.workspace }}/openpilot/selfdrive/modeld/models

on:
  workflow_call:
    inputs:
      upstream_branch:
        description: 'Upstream branch to build from'
        required: true
        default: 'master'
        type: string
      custom_name:
        description: 'Custom name for the model (no date, only name)'
        required: false
        type: string
      is_20hz:
        description: 'Is this a 20Hz model'
        required: false
        type: boolean
        default: true
      artifact_suffix:
        description: 'Suffix for artifact name'
        required: false
        type: string
        default: ''
      target_hardware:
        description: 'Hardware target to compile for (qcom or chestnut)'
        required: false
        type: string
        default: 'qcom'
      on_device:
        description: 'Compile on the tici / chestnut runner instead of on a hosted runner with tinygrad''s qcom / amd mock'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: 'Upstream branch to build from'
        required: true
        default: 'master'
        type: string
      custom_name:
        description: 'Custom name for the model (no date, only name)'
        required: false
        type: string
      is_20hz:
        description: 'Is this a 20Hz model'
        required: false
        type: boolean
        default: true
      target_hardware:
        description: 'Hardware target to compile for'
        required: true
        type: choice
        options:
          - qcom
          - chestnut
        default: 'qcom'
      on_device:
        description: 'Compile on the tici / chestnut runner instead of on a hosted runner with tinygrad''s qcom / amd mock'
        required: false
        type: boolean
        default: false


run-name: Build model [${{ inputs.custom_name || inputs.upstream_branch }}] from ref [${{ inputs.upstream_branch }}]

jobs:
  get_model:
    runs-on: ubuntu-latest
    env:
      REF: ${{ inputs.upstream_branch }}
    outputs:
      model_date: ${{ steps.commit-date.outputs.model_date }}
    steps:
      # Note: To allow dynamic models from both openpilot and sunnypilot (merges/mashups), we try commaai as default,
      # and fallback to sunnypilot if the ref checkout fails.
      - name: Checkout commaai/openpilot
        id: checkout_upstream
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: commaai/openpilot
          ref: ${{ inputs.upstream_branch }}
          fetch-depth: 1
          submodules: recursive
          path: openpilot

      - name: Fallback to sunnypilot/sunnypilot
        if: steps.checkout_upstream.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: sunnypilot/sunnypilot
          ref: ${{ inputs.upstream_branch }}
          fetch-depth: 1
          submodules: recursive
          path: openpilot
      - name: Get commit date
        id: commit-date
        run: |
          cd ${{ github.workspace }}/openpilot/openpilot
          commit_date=$(git log -1 --format=%cd --date=format:'%B %d, %Y')
          echo "model_date=${commit_date}" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

      - name: Fetch Models
        run: |
          cd ${{ github.workspace }}/openpilot/openpilot
          fetch_lfs() {
            sudo apt-get install -y -qq aria2 > /dev/null # Parallel ranges because gh is flaky
            LFS_URL=$(git config -f "$(git rev-parse --show-toplevel)/.lfsconfig" lfs.url)
            for f in "$@"; do
              grep -qs "^version https://git-lfs" "$f" || continue
              OID=$(awk -F'sha256:' '/^oid/{print $2}' "$f"); SIZE=$(awk '/^size/{print $2}' "$f")
              HREF=$(curl -fsSL --retry 3 -X POST -H "Accept: application/vnd.git-lfs+json" -H "Content-Type: application/vnd.git-lfs+json" "$LFS_URL/objects/batch" \
                -d "{\"operation\":\"download\",\"transfer\":[\"basic\"],\"objects\":[{\"oid\":\"$OID\",\"size\":$SIZE}]}" | jq -r '.objects[0].actions.download.href')
              aria2c -x 16 -s 16 -k 16M --max-tries=5 --retry-wait=5 --file-allocation=none --summary-interval=30 --allow-overwrite=true \
                -d "$(dirname "$f")" -o "$(basename "$f")" "$HREF"
              echo "$OID  $f" | sha256sum -c -
            done
          }
          UPSTREAM_PKL=selfdrive/modeld/models/big_driving_tinygrad.pkl
          if [ "${{ inputs.target_hardware }}" != "chestnut" ]; then
            git lfs pull -X "**/selfdrive/modeld/models/big_*.onnx,**/selfdrive/modeld/models/dmonitoring_*.onnx,**/selfdrive/modeld/models/big_*.pkl,**/selfdrive/modeld/models/dmonitoring_*.pkl"
            rm -f selfdrive/modeld/models/big_*.onnx selfdrive/modeld/models/dmonitoring_*.onnx selfdrive/modeld/models/big_*.pkl selfdrive/modeld/models/dmonitoring_*.pkl
          elif compgen -G "selfdrive/modeld/models/big_*.onnx" > /dev/null; then
            fetch_lfs selfdrive/modeld/models/big_*.onnx selfdrive/modeld/models/big_*.pkl
            find selfdrive/modeld/models -type f \( -name "*.onnx" -o -name "*.pkl" \) ! -name "big_*.onnx" ! -name "big_*.pkl" -delete
          elif [ -f "$UPSTREAM_PKL" ]; then
            echo "No big model ONNX tracked: converting commaai's precompiled $UPSTREAM_PKL, with the tinygrad it was built with"
            fetch_lfs "$UPSTREAM_PKL"
            find selfdrive/modeld/models -type f \( -name "*.onnx" -o -name "*.pkl" \) ! -path "$UPSTREAM_PKL" -delete
            GITMODULES="$(git rev-parse --show-toplevel)/.gitmodules"
            TG_NAME=$(git config -f "$GITMODULES" --get-regexp '^submodule\..*\.path$' | awk '$2 == "tinygrad_repo" {sub(/^submodule\./, "", $1); sub(/\.path$/, "", $1); print $1}')
            TG_URL=$(git config -f "$GITMODULES" "submodule.$TG_NAME.url" | sed 's|^\.\./\.\./|https://github.com/|')
            echo "$TG_URL $(git rev-parse HEAD:tinygrad_repo) $(sha256sum "$UPSTREAM_PKL" | cut -d' ' -f1)" > selfdrive/modeld/models/upstream_pkl.txt
          else
            echo "::error::no big model ONNX or precompiled big_driving_tinygrad.pkl at this ref"
            exit 1
          fi

          if grep -lIF "version https://git-lfs.github.com/spec/v1" selfdrive/modeld/models/*.onnx selfdrive/modeld/models/*.pkl 2>/dev/null; then
            echo "::error::the ONNX or PKL files above are still LFS pointers, not real models"
            exit 1
          fi
      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: models-${{ env.REF }}${{ inputs.artifact_suffix  }}
          compression-level: 0
          path: |
            ${{ github.workspace }}/openpilot/openpilot/selfdrive/modeld/models/*.onnx
            ${{ github.workspace }}/openpilot/openpilot/selfdrive/modeld/models/*.pkl
            ${{ github.workspace }}/openpilot/openpilot/selfdrive/modeld/models/upstream_pkl.txt
          if-no-files-found: error

  build_model:
    runs-on: ${{ inputs.on_device && fromJSON(inputs.target_hardware == 'chestnut' && '["self-hosted","chestnut"]' || '["self-hosted","tici"]') || 'ubuntu-24.04' }}
    needs: get_model
    env:
      MODEL_NAME: ${{ inputs.custom_name || inputs.upstream_branch }} (${{ needs.get_model.outputs.model_date }})
      REF: ${{ inputs.upstream_branch }}
      MOCK_BUILD: ${{ !inputs.on_device }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up the hosted mock build
        if: env.MOCK_BUILD == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install LLVM 20 and ROCm comgr for the amd mock
        if: env.MOCK_BUILD == 'true' && inputs.target_hardware == 'chestnut'
        uses: ./.github/workflows/setup-amd-mock
        with:
          emu_cache: build

      - name: Install the amd mock build dependencies
        if: env.MOCK_BUILD == 'true' && inputs.target_hardware == 'chestnut'
        run: |
          python3 -m pip install -q numpy zstandard

      - name: Install the qcom mock build dependencies
        if: env.MOCK_BUILD == 'true' && inputs.target_hardware != 'chestnut'
        id: qcom_deps
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y --no-install-recommends qemu-user-static aria2
          python3 -m pip install -q numpy zstandard tinymesa==25.2.7.2
          echo "qemu=$(dpkg-query -W -f='${Version}' qemu-user-static)" >> "$GITHUB_OUTPUT"

      - name: Compiler check passed before with all of it identical?
        if: env.MOCK_BUILD == 'true' && inputs.target_hardware != 'chestnut'
        id: qcom_compiler
        uses: actions/cache/restore@v4
        with:
          path: ~/.qcom_compiler_parity.passed
          key: qcom-compiler-parity-${{ steps.qcom_deps.outputs.qemu }}-${{ hashFiles('tinygrad_repo/test/device/qcom/compiler_parity.py', 'tinygrad_repo/test/mockgpu/qcom/a630_compiled.pkl.xz', 'tinygrad_repo/tinygrad/runtime/support/compiler_qcom.py') }}

      - name: Check the off-device qcom compiler builds the a630's bytes
        if: env.MOCK_BUILD == 'true' && inputs.target_hardware != 'chestnut' && steps.qcom_compiler.outputs.cache-hit != 'true'
        run: |
          # every kernel an a630 has compiled must compile to the same bytes here before a model is built here
          PYTHONPATH="$TINYGRAD_PATH" python3 "$TINYGRAD_PATH/test/device/qcom/compiler_parity.py" check "$TINYGRAD_PATH/test/mockgpu/qcom/a630_compiled.pkl.xz"
          touch ~/.qcom_compiler_parity.passed

      - name: Remember the compiler check passed
        if: env.MOCK_BUILD == 'true' && inputs.target_hardware != 'chestnut' && steps.qcom_compiler.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.qcom_compiler_parity.passed
          key: ${{ steps.qcom_compiler.outputs.cache-primary-key }}

      - name: Set environment variables
        if: env.MOCK_BUILD != 'true'
        id: set-env
        run: |
          # Set up common environment
          source /etc/profile;
          export UV_PROJECT_ENVIRONMENT=${HOME}/venv
          export UV_PYTHON_PREFERENCE=managed
          export UV_PYTHON_INSTALL_DIR=${HOME}/uv/python
          export VIRTUAL_ENV=$UV_PROJECT_ENVIRONMENT
          uv sync --frozen
          printenv >> $GITHUB_ENV

      - name: Setup build environment
        if: env.MOCK_BUILD != 'true'
        run: |
          mkdir -p "${BUILD_DIR}/"
          sudo find $BUILD_DIR/ -mindepth 1 -delete
          echo "Starting build stage..."
          echo "BUILD_DIR: ${BUILD_DIR}"
          echo "CI_DIR: ${CI_DIR}"
          echo "VERSION: ${{ steps.set-env.outputs.version }}"
          echo "UV_PROJECT_ENVIRONMENT: ${UV_PROJECT_ENVIRONMENT}"
          echo "VIRTUAL_ENV: ${VIRTUAL_ENV}"
          source ${UV_PROJECT_ENVIRONMENT}/bin/activate
          PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/ ${{ github.workspace }}/scripts/manage-powersave.py --disable
          rm -rf ${{ env.MODELS_DIR }}/*.onnx*

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: models-${{ env.REF }}${{ inputs.artifact_suffix }}
          path: ${{ env.MODELS_DIR }}

      - name: Build Model
        run: |
          if [ "$MOCK_BUILD" = "true" ]; then
            TASKSET=""
            export CHECK_OOB=0 GMMU=0  # as test/mockgpu runs the amd mock
          else
            source /etc/profile
            export UV_PROJECT_ENVIRONMENT=${HOME}/venv
            export VIRTUAL_ENV=$UV_PROJECT_ENVIRONMENT
            source ${UV_PROJECT_ENVIRONMENT}/bin/activate
            TASKSET="taskset -c 7"
          fi
          export PYTHONPATH="${PYTHONPATH}:${{ env.TINYGRAD_PATH }}:${{ github.workspace }}"

          COMPILE_MODELD="${{ github.workspace }}/openpilot/sunnypilot/modeld_v2/compile_modeld.py"
          MODEL_SIZE=$(python3 -c "from openpilot.common.transformations.model import MEDMODEL_INPUT_SIZE as s; print(f'{s[0]}x{s[1]}')")
          CAMERA_RES=$(python3 -c "from openpilot.common.transformations.camera import _ar_ox_fisheye as a, _os_fisheye as o; print(f'{a.width}x{a.height} {o.width}x{o.height}')")

          MOCK=$([ "$MOCK_BUILD" = "true" ] && echo MOCK || true)
          TG_FLAGS_QCOM="DEV=${MOCK:+MOCK+}QCOM IMAGE=1 FLOAT16=1 NOLOCALS=1 OPENPILOT_HACKS=1"
          if [ "${{ inputs.target_hardware }}" == "chestnut" ]; then
            echo "CHESTNUT build"
            export CHESTNUT=1
            TG_FLAGS="DEBUG=1 DEV=${MOCK}USB+AMD:LLVM FRAME_DEV=CPU FLOAT16=1 GMMU=0 TC_OPT=2 TC_MIN_GLOBALS=32"
            OUTPUT_PKL="${{ env.MODELS_DIR }}/big_driving_tinygrad.pkl"
          else
            echo "QCOM build"
            TG_FLAGS="$TG_FLAGS_QCOM"
            OUTPUT_PKL="${{ env.MODELS_DIR }}/driving_tinygrad.pkl"
          fi

          NATIVE_PKL=$(find "${{ env.MODELS_DIR }}" -maxdepth 1 -name "*.pkl" -print -quit)

          if [ -f "${{ env.MODELS_DIR }}/upstream_pkl.txt" ]; then
            read -r TG_URL TG_SHA _ < "${{ env.MODELS_DIR }}/upstream_pkl.txt"
            echo "Converting commaai's precompiled model with tinygrad $TG_SHA"
            UPSTREAM_TG="${{ runner.temp }}/upstream_tinygrad"
            rm -rf "$UPSTREAM_TG" && git init -q "$UPSTREAM_TG" && git -C "$UPSTREAM_TG" fetch -q --depth 1 "$TG_URL" "$TG_SHA" && git -C "$UPSTREAM_TG" checkout -q FETCH_HEAD
            ON_MOCK=""
            if [ "$MOCK_BUILD" = "true" ]; then ON_MOCK="env PYTHONPATH=$TINYGRAD_PATH python3 $TINYGRAD_PATH/test/mockgpu/usb_server.py"; fi
            CONVERTED="${{ runner.temp }}/big_driving_tinygrad_plain.pkl"
            $ON_MOCK env DEV=USB+AMD PYTHONPATH="$UPSTREAM_TG:${{ github.workspace }}" $TASKSET python3 openpilot/sunnypilot/modeld_v2/convert_upstream_pkl.py \
              "${{ env.MODELS_DIR }}/big_driving_tinygrad.pkl" "$CONVERTED"
            mv "$CONVERTED" "$OUTPUT_PKL"
          elif NEW_ARCH_ONNX=$(find "${{ env.MODELS_DIR }}" -maxdepth 1 -name "${{ inputs.target_hardware == 'chestnut' && 'big_' || '' }}*driving*.onnx" -print -quit) &&
               [ -n "$NEW_ARCH_ONNX" ] && grep -qa new_img "$NEW_ARCH_ONNX"; then # the new architecture: one ONNX taking the warped frames as new_img
            echo "Compiling new architecture ONNX: $NEW_ARCH_ONNX"
            env ${TG_FLAGS} $TASKSET python3 openpilot/sunnypilot/modeld_v2/compile_modeld_v2.py \
              "$NEW_ARCH_ONNX" "$OUTPUT_PKL" --device-input "*" --benchmark-runs 1
          else
            echo "Detected onnx architecture. Routing to native compile_modeld.py."
            # Detect model type and build compile args
            VISION_ONNX=""
            for f in "${{ env.MODELS_DIR }}/driving_vision.onnx" "${{ env.MODELS_DIR }}/big_driving_vision.onnx"; do
              [ -f "$f" ] && VISION_ONNX="$f" && break
            done

            POLICY_ONNX=""
            for f in "${{ env.MODELS_DIR }}/driving_policy.onnx" "${{ env.MODELS_DIR }}/big_driving_policy.onnx"; do
              [ -f "$f" ] && POLICY_ONNX="$f" && break
            done

            OFF_POLICY_ONNX=""
            for f in "${{ env.MODELS_DIR }}/driving_off_policy.onnx" "${{ env.MODELS_DIR }}/big_driving_off_policy.onnx"; do
              [ -f "$f" ] && OFF_POLICY_ONNX="$f" && break
            done

            ON_POLICY_ONNX=""
            for f in "${{ env.MODELS_DIR }}/driving_on_policy.onnx" "${{ env.MODELS_DIR }}/big_driving_on_policy.onnx"; do
              [ -f "$f" ] && ON_POLICY_ONNX="$f" && break
            done

            SUPERCOMBO_ONNX=""
            for f in "${{ env.MODELS_DIR }}/supercombo.onnx" "${{ env.MODELS_DIR }}/driving_supercombo.onnx" "${{ env.MODELS_DIR }}/big_supercombo.onnx" "${{ env.MODELS_DIR }}/big_driving_supercombo.onnx"; do
              [ -f "$f" ] && SUPERCOMBO_ONNX="$f" && break
            done

            MODEL_TYPE="" ONNX_ARGS="" OUTPUT_NAME=""
            if [ -f "$VISION_ONNX" ]; then
              ONNX_ARGS="--vision-onnx $VISION_ONNX"
              if [ -f "$ON_POLICY_ONNX" ] && [ -f "$OFF_POLICY_ONNX" ]; then
                MODEL_TYPE=vision_multi_policy
                ONNX_ARGS="$ONNX_ARGS --off-policy-onnx $OFF_POLICY_ONNX --on-policy-onnx $ON_POLICY_ONNX"
              elif [ -f "$OFF_POLICY_ONNX" ] && [ -f "$POLICY_ONNX" ]; then
                MODEL_TYPE=vision_multi_policy
                ONNX_ARGS="$ONNX_ARGS --policy-onnx $POLICY_ONNX --off-policy-onnx $OFF_POLICY_ONNX"
              elif [ -f "$POLICY_ONNX" ]; then
                MODEL_TYPE=vision_policy
                ONNX_ARGS="$ONNX_ARGS --policy-onnx $POLICY_ONNX"
              fi
            elif [ -f "$SUPERCOMBO_ONNX" ]; then
              MODEL_TYPE=supercombo
              ONNX_ARGS="--supercombo-onnx $SUPERCOMBO_ONNX"
            fi

            if [ -n "$MODEL_TYPE" ]; then
              echo "Detected: $MODEL_TYPE -> $OUTPUT_PKL"
              env ${TG_FLAGS} $TASKSET python3 "$COMPILE_MODELD" \
                --model-type $MODEL_TYPE \
                --model-size $MODEL_SIZE \
                --camera-resolutions $CAMERA_RES \
                $ONNX_ARGS \
                --output "$OUTPUT_PKL"
            fi
          fi

      - name: Replay its check frame on the mock and require the result bit for bit
        if: env.MOCK_BUILD == 'true'
        env:
          DEV: ${{ inputs.target_hardware == 'chestnut' && 'MOCKUSB+AMD' || 'MOCK+QCOM' }}
          PYTHONPATH: ${{ env.TINYGRAD_PATH }}:${{ github.workspace }}
        run: python3 -m openpilot.sunnypilot.modeld_v2.mock_parity check "${{ env.MODELS_DIR }}/${{ inputs.target_hardware == 'chestnut' && 'big_' || '' }}driving_tinygrad.pkl"

      - name: Prepare Output
        run: |
          sudo rm -rf ${{ env.OUTPUT_DIR }}
          mkdir -p ${{ env.OUTPUT_DIR }}

          # Copy the model files
          rsync -avm \
            --include='*.dlc' \
            --include='/${{ inputs.target_hardware == 'chestnut' && 'big_' || '' }}driving_tinygrad.pkl' \
            --exclude='*' \
            --delete-excluded \
            $([ "$MOCK_BUILD" = "true" ] || echo --chown=comma:comma) \
            ${{ env.MODELS_DIR }}/ ${{ env.OUTPUT_DIR }}/

          python3 "${{ github.workspace }}/release/ci/model_generator.py" \
            --model-dir "${{ env.MODELS_DIR }}" \
            --output-dir "${{ env.OUTPUT_DIR }}" \
            --custom-name "${{ env.MODEL_NAME }}" \
            --upstream-branch "${{ inputs.upstream_branch }}" \
            $([ -f "${{ env.MODELS_DIR }}/upstream_pkl.txt" ] && echo "--onnx-sha256 $(cut -d' ' -f3 "${{ env.MODELS_DIR }}/upstream_pkl.txt")") \
            ${{ inputs.is_20hz && '--is-20hz' || '' }}

      - name: Write artifact name to file
        run: echo "model-${{ env.MODEL_NAME }}${{ inputs.artifact_suffix }}-${{ github.run_number }}" > ${{ env.OUTPUT_DIR }}/artifact_name.txt

      - name: Upload Build Artifacts
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ env.MODEL_NAME }}${{ inputs.artifact_suffix }}-${{ github.run_number }}
          path: ${{ env.OUTPUT_DIR }}
          compression-level: 0

      - name: Upload artifact name file
        uses: actions/upload-artifact@v4
        with:
          name: artifact-name-${{ inputs.custom_name || inputs.upstream_branch }}
          path: ${{ env.OUTPUT_DIR }}/artifact_name.txt

      - name: Re-enable powersave
        if: always() && env.MOCK_BUILD != 'true'
        run: |
          source ${UV_PROJECT_ENVIRONMENT}/bin/activate
          PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/ ${{ github.workspace }}/scripts/manage-powersave.py --enable
