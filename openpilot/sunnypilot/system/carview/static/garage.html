<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>carview garage</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dcdde0;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #bar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 8px; }
  #bar button { font-size: 15px; padding: 10px 16px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.9);
    color: #1d1f22; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,0.1); }
  #bar button.on { background: #1d1f22; color: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import { buildCar, studioEnvironment, supersampler, CAR_TYPES } from '/cars.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
const ss = supersampler(renderer);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdcdde0);
scene.environment = studioEnvironment(THREE, renderer);
scene.environmentIntensity = 0.75;
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(-5, 9, 6); scene.add(sun);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0xeeeff1, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);

const cars = [];
const params = new URLSearchParams(location.search);
// ?car=sedan shows one car up close, otherwise the whole row
const row = params.get('car') ? [[params.get('car'), params.get('paint') || 'clay']] : [...CAR_TYPES.map(t => [t, 'clay']), ['crossover', 'ego']];
row.forEach(([type, paint], i) => {
  const car = buildCar(THREE, type, paint);
  car.position.x = (i - (row.length - 1) / 2) * 6.4;
  scene.add(car); cars.push(car);
});

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 200);
const VIEWS = { front: [0.55, 0.30], side: [Math.PI / 2, 0.12], rear: [Math.PI + 0.6, 0.32], chase: [Math.PI, 0.45] };
let view = new URLSearchParams(location.search).get('view') || 'front';
const bar = document.getElementById('bar');
for (const v of Object.keys(VIEWS)) {
  const b = document.createElement('button'); b.textContent = v;
  b.onclick = () => { view = v; for (const x of bar.children) x.className = x === b ? 'on' : ''; };
  if (v === view) b.className = 'on';
  bar.appendChild(b);
}
const resize = () => {
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
};
window.addEventListener('resize', resize); resize();

const spin = new URLSearchParams(location.search).has('spin');
function frame(t) {
  const [yaw, pitch] = VIEWS[view];
  // the camera stays put in front of the row and every car turns to the chosen angle, so they're all seen alike
  cars.forEach(c => { c.rotation.y = Math.PI + yaw + (spin ? t / 4000 : 0); });
  const d = row.length > 1 ? 40 : 12;
  camera.position.set(0, d * Math.sin(pitch) + 0.6, d * Math.cos(pitch));
  camera.lookAt(0, 0.7, 0);
  ss.tick(t);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
