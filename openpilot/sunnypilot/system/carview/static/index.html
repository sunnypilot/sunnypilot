<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>carview</title>
<style>
  :root {
    --sky: #dcdde0; --ink: #1d1f22; --muted: #6b7076; --faint: #a3a7ad; --card: rgba(255, 255, 255, 0.9);
    --blue: #3e6ae1; --green: #2fb344; --amber: #c27c0e; --red: #c8312f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-user-select: none; user-select: none; }
  #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

  #hud { position: fixed; top: 20px; left: 28px; }
  #gears { letter-spacing: 0.35em; font-size: 17px; color: var(--faint); font-weight: 600; }
  #gears b { color: var(--ink); }
  #speedRow { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
  #speed { font-size: 84px; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; min-width: 1.2em; }
  .blinker { width: 26px; height: 26px; opacity: 0.14; transition: opacity 0.08s; }
  .blinker.on { opacity: 1; }
  #unit { font-size: 15px; color: var(--muted); letter-spacing: 0.12em; margin-left: 40px; }
  #setRow { display: flex; gap: 14px; align-items: center; margin-top: 12px; }
  #max { font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--muted); text-align: center; }
  #max small { font-size: 12px; display: block; letter-spacing: 0.12em; }
  #max.on { color: var(--blue); }
  #limit { display: none; width: 50px; border: 2px solid var(--ink); border-radius: 7px; background: #fff; text-align: center;
    padding: 3px 0 2px; line-height: 1; }
  #limit small { display: block; font-size: 8px; font-weight: 700; letter-spacing: 0.04em; }
  #limit b { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #wheel { width: 30px; height: 30px; color: var(--faint); }
  #wheel.steer { color: var(--blue); } #wheel.on { color: var(--blue); }
  #wheel.on circle.fill { fill: currentColor; fill-opacity: 0.16; }

  #nav { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--card);
    border-radius: 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1); padding: 10px 18px 10px 12px; align-items: center; gap: 12px; max-width: 46vw; }
  #navArrow { width: 38px; height: 38px; flex: none; }
  #navDist { font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #navStreet { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #topRight { position: fixed; top: 20px; right: 24px; text-align: right; }
  #clockRow { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
  #clock { font-size: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #eta { display: none; margin-top: 6px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* between the speed panel on the left and the buttons and clock on the right */
  #alert { display: none; position: fixed; left: 50%; top: 20px; transform: translateX(-50%); width: max-content;
    max-width: calc(100vw - 460px); min-width: 220px; border-radius: 14px; padding: 12px 20px; color: #fff; text-align: center; background: rgba(29, 31, 34, 0.9);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18); }
  #alert.userPrompt { background: var(--amber); } #alert.critical { background: var(--red); }
  #alert b { display: block; font-size: 20px; font-weight: 600; }
  #alert span { display: block; font-size: 15px; opacity: 0.9; margin-top: 3px; }

  #status { display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--card);
    border-radius: 12px; padding: 12px 18px; font-size: 16px; color: var(--muted); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1); }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud">
  <div id="gears">P R N D</div>
  <div id="speedRow">
    <svg class="blinker" id="blinkL" viewBox="0 0 24 24"><path fill="#2fb344" d="M10 4 2 12l8 8v-5h12V9H10z"/></svg>
    <div id="speed">--</div>
    <svg class="blinker" id="blinkR" viewBox="0 0 24 24"><path fill="#2fb344" d="M14 4l8 8-8 8v-5H2V9h12z"/></svg>
  </div>
  <div id="unit">MPH</div>
  <div id="setRow">
    <svg id="wheel" viewBox="0 0 32 32" aria-label="steering"><circle class="fill" cx="16" cy="16" r="13" fill="none"/>
      <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.6"/>
      <path d="M3.5 14.5c4-1.6 8.2-2.4 12.5-2.4s8.5.8 12.5 2.4M16 18v10.5M12.5 18.5 4.6 22.6M19.5 18.5l7.9 4.1" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
    <div id="max">--<small>MAX</small></div>
    <div id="limit"><small>SPEED<br>LIMIT</small><b>--</b></div>
  </div>
</div>

<div id="nav"><svg id="navArrow" viewBox="0 0 40 40"><g id="navArrowG" transform="rotate(0 20 20)">
  <path d="M20 5 9 17h7v18h8V17h7z" fill="#1d1f22"/></g></svg>
  <div><div id="navDist"></div><div id="navStreet"></div></div></div>

<div id="topRight">
  <div id="clockRow">
    <div id="clock"></div>
  </div>
  <div id="eta"></div>
</div>

<div id="alert"><b></b><span></span></div>
<div id="status">Waiting for the comma…</div>

<script type="module">
const REPORT_S = 2;
const started = performance.now();
const m = { frames: 0, frameGapMax: 0, events: 0, eventGapMax: 0, lastEvent: 0, rtt: null, three: 'loading', threeError: '',
            webgl2: !!document.createElement('canvas').getContext('webgl2'), renderer: '' };
let car = {}, view = null, fps = 0, fpsMin = Infinity;

const $ = (id) => document.getElementById(id);

// ---- live data from the comma
const es = new EventSource('/events');
let eventsThisWindow = 0;
es.onmessage = (e) => {
  const now = performance.now();
  if (m.lastEvent) m.eventGapMax = Math.max(m.eventGapMax, now - m.lastEvent);
  m.lastEvent = now; m.events++; eventsThisWindow++;
  try { car = JSON.parse(e.data); } catch (err) { return; }
  if (view) view.update(car);
};

// ---- the scene
(async () => {
  try {
    const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
    const { createView } = await import('/view.js');
    view = createView(THREE, $('scene'));
    view.update(car);
    m.three = 'loaded';
    const g = document.createElement('canvas').getContext('webgl');
    const info = g && g.getExtension('WEBGL_debug_renderer_info');
    m.renderer = info ? g.getParameter(info.UNMASKED_RENDERER_WEBGL) : '';
  } catch (err) {
    m.three = 'failed'; m.threeError = String(err).slice(0, 200);
    $('status').textContent = "Couldn't load the 3D view: " + m.threeError; $('status').style.display = 'block';
  }
})();

let last = 0;
function frame(now) {
  const dt = last ? Math.min((now - last) / 1000, 0.25) : 0;
  if (last) m.frameGapMax = Math.max(m.frameGapMax, now - last);
  last = now; m.frames++;
  if (view) view.frame(now, dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- HUD, a few times a second
const GEARS = { park: 'P', reverse: 'R', neutral: 'N', drive: 'D' };
const MPH = 2.23694;
function fmtDistance(m_) { const mi = m_ / 1609.34; return mi < 0.1 ? `${Math.max(10, Math.round(m_ * 3.28084 / 10) * 10)} ft` : `${mi < 10 ? mi.toFixed(1) : Math.round(mi)} mi`; }
function arrowAngle(type, modifier) {
  if (type === 'arrive') return 0;
  const mod = (modifier || '').toLowerCase();
  const a = { 'sharp left': -135, 'left': -90, 'slight left': -45, 'straight': 0, 'slight right': 45, 'right': 90, 'sharp right': 135, 'uturn': 180 }[mod];
  return a ?? 0;
}
function hud() {
  const gear = GEARS[car.gear] || '';
  $('gears').innerHTML = ['P', 'R', 'N', 'D'].map(g => (g === gear ? `<b>${g}</b>` : g)).join(' ');
  $('speed').textContent = car.carStateAlive ? Math.round((car.vEgo || 0) * MPH) : '--';
  const set = car.vCruise > 0 && car.vCruise < 250 ? Math.round(car.vCruise * 0.621371) : null;
  $('max').innerHTML = `${set ?? '--'}<small>MAX</small>`;
  $('max').className = car.engaged ? 'on' : '';
  $('wheel').setAttribute('class', car.engaged ? 'on' : car.mads ? 'steer' : '');
  const limit = car.speedLimit > 0 ? Math.round(car.speedLimit * MPH) : 0;
  $('limit').style.display = limit ? 'block' : 'none';
  $('limit').querySelector('b').textContent = limit || '';
  const blinkOn = Math.floor(performance.now() / 333) % 2 === 0;
  $('blinkL').classList.toggle('on', !!car.leftBlinker && blinkOn);
  $('blinkR').classList.toggle('on', !!car.rightBlinker && blinkOn);

  const nav = car.nav;
  $('nav').style.display = nav ? 'flex' : 'none';
  if (nav) {
    $('navArrowG').setAttribute('transform', `rotate(${arrowAngle(nav.type, nav.modifier)} 20 20)`);
    $('navDist').textContent = fmtDistance(nav.distance);
    $('navStreet').textContent = nav.primary;
    const arrive = new Date(Date.now() + nav.timeRemaining * 1000);
    $('eta').style.display = 'block';
    $('eta').textContent = `${arrive.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })} · ${Math.round(nav.timeRemaining / 60)} min · ${fmtDistance(nav.distanceRemaining)}`;
  } else $('eta').style.display = 'none';

  const al = $('alert');
  al.style.display = car.alert ? 'block' : 'none';
  al.style.top = nav ? `${$('nav').offsetHeight + 32}px` : '20px';  // under the nav card when there is one
  al.className = car.alertStatus || '';
  al.querySelector('b').textContent = car.alert || '';
  al.querySelector('span').textContent = car.alert2 || '';
  $('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

  const quiet = !m.lastEvent || performance.now() - m.lastEvent > 1500;
  if (m.three !== 'failed') { $('status').textContent = 'Waiting for the comma…'; $('status').style.display = quiet ? 'block' : 'none'; }
}
setInterval(hud, 166);

// frames counted by the clock, so a browser that stops drawing reads 0 instead of its last rate
let fpsFrames = 0, fpsTime = performance.now();
setInterval(() => {
  const now = performance.now();
  fps = Math.round((m.frames - fpsFrames) * 1000 / (now - fpsTime));
  fpsMin = Math.min(fpsMin, fps); fpsFrames = m.frames; fpsTime = now;
}, 1000);

// No full screen or pop-out buttons: in the car the browser accepts a full-screen request but stays inside its panel
// (773x601), has no picture-in-picture, and opens a sized window.open as another tab of the same size. Only the
// browser's own expand button makes the page bigger (1256x706, over the map).

// ---- report to the comma what this browser managed
async function report() {
  const body = {
    page: 'view', uptimeS: Math.round((performance.now() - started) / 1000), fps,
    fpsMin: Number.isFinite(fpsMin) ? fpsMin : null, frames: m.frames, frameGapMaxMs: Math.round(m.frameGapMax), events: m.events,
    eventGapMaxMs: Math.round(m.eventGapMax), eventSource: es.readyState, webgl2: m.webgl2, renderer: m.renderer, three: m.three,
    threeError: m.threeError, pixelRatio: view ? view.pixelRatio : null, visibility: document.visibilityState,
    w: window.innerWidth, h: window.innerHeight, dpr: window.devicePixelRatio, rttMs: m.rtt, ua: navigator.userAgent,
  };
  m.frameGapMax = 0; m.eventGapMax = 0; fpsMin = Infinity;
  const t0 = performance.now();
  try {
    const r = await fetch('/report', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (r.ok) m.rtt = Math.round(performance.now() - t0);
  } catch (err) { /* the next one will tell */ }
}
setInterval(report, REPORT_S * 1000);
document.addEventListener('visibilitychange', report);
</script>
</body>
</html>
