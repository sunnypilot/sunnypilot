# Page: vehicle (per-brand settings)
# Compiles to settings_ui.json#vehicle_settings (brand = section id).
id: vehicle
label: Vehicle
icon: vehicle
order: 99
kind: vehicle
sections:
- id: hyundai
  title: Hyundai / Kia / Genesis Settings
  description: ''
  items:
  - key: HyundaiLongitudinalTuning
    widget: multiple_button
    title: Custom Longitudinal Tuning
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Dynamic
    - value: 2
      label: Predictive
    visibility:
    - type: capability
      field: hyundai_alpha_long_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/longitudinal'
- id: subaru
  title: Subaru Settings
  description: ''
  items:
  - key: SubaruStopAndGo
    widget: toggle
    title: Stop and Go (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
  - key: SubaruStopAndGoManualParkingBrake
    widget: toggle
    title: Stop and Go for Manual Parking Brake (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
- id: tesla
  title: Tesla Settings
  description: ''
  items:
  - key: TeslaCoopSteering
    widget: toggle
    title: Cooperative Steering (Beta)
    enablement:
    - $ref: '#/macros/offroad'
  - key: TeslaMadsScreenButton
    widget: multiple_button
    title: MADS Screen Activation
    description: 'Use a multi-finger press on the infotainment screen to toggle MADS.
      This allows the use of full MADS functionality when enabled. Selecting a higher
      finger count may reduce accidental activations. Note: Setting this to Off will
      reset your MADS settings to default.'
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: 3-Finger
    - value: 2
      label: 4-Finger
    - value: 3
      label: 5-Finger
    visibility:
    - type: capability
      field: tesla_has_vehicle_bus
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
- id: toyota
  title: Toyota / Lexus Settings
  description: ''
  items:
  - key: ToyotaAutoHold
    widget: toggle
    needs_onroad_cycle: true
    title: 'Toyota: Auto Brake Hold FOR TSS2 HYBRID CARS'
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaEnhancedBsm
    widget: toggle
    needs_onroad_cycle: true
    title: 'Toyota: Prius TSS2 BSM and some tssp'
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaPriusTss2Pid
    widget: toggle
    needs_onroad_cycle: true
    title: 'Toyota: Prius TSS2 PID Lateral Control (Alpha)'
    description: Use a PID lateral controller instead of torque control on Prius TSS2. Overrides Neural
      Network Lateral Control and Enforce Torque Control for this car. Starting gains are unvalidated on
      a real Prius TSS2 — expect to need on-road tuning. Use at your own risk.
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaTSS2Long
    widget: toggle
    needs_onroad_cycle: true
    title: 'Toyota: custom longitudinal for TSS2'
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaDriveMode
    widget: toggle
    needs_onroad_cycle: true
    title: Enable drive mode btn link
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaEnforceStockLongitudinal
    widget: toggle
    needs_onroad_cycle: true
    title: Enforce Factory Longitudinal Control
    description: sunnypilot will not take over control of gas and brakes. Factory Toyota longitudinal control will be used.
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaStopAndGoHack
    widget: toggle
    needs_onroad_cycle: true
    title: Stop and Go Hack (Alpha)
    description: sunnypilot will allow some Toyota/Lexus cars to auto resume during stop and go traffic. This feature is only
      applicable to certain models that are able to use longitudinal control. This is an alpha feature. Use at your own risk.
    enablement:
    - $ref: '#/macros/not_engaged'
    - $ref: '#/macros/longitudinal'
    - type: param
      key: ToyotaEnforceStockLongitudinal
      equals: false
