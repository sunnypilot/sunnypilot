# Page: vehicle (per-brand settings)
# Compiles to settings_ui.json#vehicle_settings (brand = section id).
id: vehicle
label: Vehicle
icon: vehicle
order: 99
kind: vehicle
sections:
- id: ford
  title: Ford Settings
  description: ''
  items:
  - key: FordModelActionController
    widget: toggle
    needs_onroad_cycle: true
    title: Selected-Action Path Tracking (Experimental)
    description: Follow the selected desired curvature using path-offset and heading commands with measured steering feedback on any Ford CAN FD vehicle.
    details: Derives path offset and heading from the same selected desired curvature and adjusts the heading request using the difference between requested and measured steering. Uses remaining path-offset range when the base heading request reaches its limit. The correction holds when steering matches and clears on driver override. Default off; physical tracking and turn-exit behavior are not road-validated. Enable only for controlled testing. Turning it off restores upstream Ford curvature control, regardless of any previously stored experimental settings. Only Ford CAN FD vehicles can use this experiment. Changes apply after a real offroad-to-onroad cycle, not immediately or on disengagement alone.
    enablement:
    - $ref: '#/macros/offroad'
  - key: FordGeometryReference
    widget: toggle
    needs_onroad_cycle: true
    title: Model Geometry Reference (Experimental)
    description: Use model heading and heading rate as the steering reference for the Ford C0/C1 controller.
    details: On uses the published model path to calculate desired curvature at the model's existing preview time, with the same output smoothing. Off uses the original model action. Both use the existing C0/C1 mapping, steering feedback, and limits. Requires Selected-Action Path Tracking; otherwise upstream Ford control remains selected. The original action and selected reference are both logged. Default off. Changes apply after an offroad-to-onroad cycle.
    enablement:
    - $ref: '#/macros/offroad'
    - type: param
      key: FordModelActionController
      equals: true
- id: hyundai
  title: Hyundai / Kia / Genesis Settings
  description: ''
  items:
  - key: HyundaiLongitudinalTuning
    widget: multiple_button
    title: Custom Longitudinal Tuning
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Dynamic
    - value: 2
      label: Predictive
    visibility:
    - type: capability
      field: hyundai_alpha_long_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/longitudinal'
- id: subaru
  title: Subaru Settings
  description: ''
  items:
  - key: SubaruStopAndGo
    widget: toggle
    title: Stop and Go (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
  - key: SubaruStopAndGoManualParkingBrake
    widget: toggle
    title: Stop and Go for Manual Parking Brake (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
- id: tesla
  title: Tesla Settings
  description: ''
  items:
  - key: TeslaCoopSteering
    widget: toggle
    title: Cooperative Steering (Beta)
    enablement:
    - $ref: '#/macros/offroad'
  - key: TeslaMadsScreenButton
    widget: multiple_button
    title: MADS Screen Activation
    description: 'Use a multi-finger press on the infotainment screen to toggle MADS.
      This allows the use of full MADS functionality when enabled. Selecting a higher
      finger count may reduce accidental activations. Note: Setting this to Off will
      reset your MADS settings to default.'
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: 3-Finger
    - value: 2
      label: 4-Finger
    - value: 3
      label: 5-Finger
    visibility:
    - type: capability
      field: tesla_has_vehicle_bus
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
- id: toyota
  title: Toyota / Lexus Settings
  description: ''
  items:
  - key: ToyotaEnforceStockLongitudinal
    widget: toggle
    needs_onroad_cycle: true
    title: Enforce Factory Longitudinal Control
    description: sunnypilot will not take over control of gas and brakes. Factory Toyota longitudinal control will be used.
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaStopAndGoHack
    widget: toggle
    needs_onroad_cycle: true
    title: Stop and Go Hack (Alpha)
    description: sunnypilot will allow some Toyota/Lexus cars to auto resume during stop and go traffic. This feature is only
      applicable to certain models that are able to use longitudinal control. This is an alpha feature. Use at your own risk.
    enablement:
    - $ref: '#/macros/not_engaged'
    - $ref: '#/macros/longitudinal'
    - type: param
      key: ToyotaEnforceStockLongitudinal
      equals: false
