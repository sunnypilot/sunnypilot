# Page: device
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: device
label: Device
icon: device
order: 6
remote_configurable: true
description: Device behavior, units, and recording settings
sections:
- id: general
  title: General
  description: Power, boot, and unit preferences
  items:
  - key: OffroadMode
    widget: toggle
    title: Force Offroad Mode
  - key: DeviceBootMode
    widget: option
    title: Wake Up Behavior
    description: 'Controls state of the device after boot/sleep. Default: Device will boot/wake-up normally and will be ready
      to engage. Offroad: Device will be in Always Offroad mode after boot/wake-up.'
    options:
    - value: 0
      label: Standard
    - value: 1
      label: Always Offroad
  - key: QuietMode
    widget: toggle
    title: Quiet Mode
  - key: OnroadUploads
    widget: toggle
    title: Onroad Uploads
  - key: MaxTimeOffroad
    widget: option
    title: Max Time Offroad
    description: Device will automatically shutdown after set time once the engine is turned off. 30h is the default.
    options:
    - value: 0
      label: Always On
    - value: 5
      label: 5m
    - value: 10
      label: 10m
    - value: 15
      label: 15m
    - value: 30
      label: 30m
    - value: 60
      label: 1h
    - value: 120
      label: 2h
    - value: 180
      label: 3h
    - value: 300
      label: 5h
    - value: 600
      label: 10h
    - value: 1440
      label: 24h
    - value: 1800
      label: 30h (Default)
- id: chestnut
  title: chestnut
  description: External GPU power
  items:
  - key: ChestnutPowerLimit
    widget: option
    title: GPU Power Limit
    description: Caps the chestnut GPU's package power (PPT) before the driving model loads. Use it when the enclosure runs
      from a 12V accessory outlet, whose wiring sags under the GPU's stock boost transients and can reset the USB link or hang
      the model mid-drive. Current driving models run within 60W. Stock leaves the GPU's own limit untouched. Takes effect at
      the next model load (ignition on).
    options:
    - value: 0
      label: Stock
    - value: 40
      label: 40W
    - value: 50
      label: 50W
    - value: 60
      label: 60W
    - value: 70
      label: 70W
    - value: 80
      label: 80W
    - value: 100
      label: 100W
    visibility:
    - type: capability
      field: device_type
      equals: mici
    enablement:
    - $ref: '#/macros/advanced_only'
- id: language
  title: Language
  items:
  - key: LanguageSetting
    widget: info
    title: Language
